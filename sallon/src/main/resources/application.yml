spring:
  application:
    name: sallon-management-system

  datasource:
    url: jdbc:mysql://localhost:3307/sallonManagementSystem
    username: root
    password: 1234
    driver-class-name: com.mysql.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect